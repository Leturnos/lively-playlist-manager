[project]
name = "lively-playlist-manager"
version = "1.0.0"
description = "A custom wallpaper playlist manager for Lively Wallpaper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "moviepy>=2.0.0",
    "psutil>=6.0.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[tool.uv]
managed = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
